name: SDK release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(ruby -rjson -e 'print JSON.parse(File.read("release-manifest.json")).fetch("version")')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Swift tests
        run: swift test --jobs 2
      - name: Build for iOS Simulator
        run: xcodebuild -scheme FounderHQJourneys -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/sdk-build" -jobs 2 CODE_SIGNING_ALLOWED=NO build
      - name: Validate CocoaPods consumer
        run: pod lib lint FounderHQJourneys.podspec --platforms=ios
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish CocoaPod
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          test -n "$COCOAPODS_TRUNK_TOKEN"
          pod trunk push FounderHQJourneys.podspec
      - name: Create GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              generate_release_notes: true
            });
